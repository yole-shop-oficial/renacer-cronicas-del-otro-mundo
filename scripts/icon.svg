<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#3b2f63"/>
      <stop offset="55%" stop-color="#221a3a"/>
      <stop offset="100%" stop-color="#120f1a"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#cfc3ef"/>
      <stop offset="55%" stop-color="#9d86dd"/>
      <stop offset="100%" stop-color="#6b53b0"/>
    </radialGradient>
    <radialGradient id="mist2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#efe9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b9a5ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="45%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#d4a94e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- estrellas -->
  <circle cx="96" cy="98" r="4" fill="#efe9ff" opacity="0.55"/>
  <circle cx="418" cy="82" r="3" fill="#efe9ff" opacity="0.4"/>
  <circle cx="452" cy="180" r="2.6" fill="#efe9ff" opacity="0.45"/>
  <circle cx="66" cy="230" r="2.6" fill="#efe9ff" opacity="0.35"/>
  <circle cx="388" cy="392" r="3" fill="#efe9ff" opacity="0.3"/>
  <circle cx="120" cy="404" r="2.4" fill="#efe9ff" opacity="0.3"/>

  <!-- halo de luna detrás -->
  <circle cx="256" cy="208" r="132" fill="url(#mist2)" filter="url(#softglow)"/>

  <!-- cuerpo de niebla de la criatura -->
  <g filter="url(#softglow)">
    <path d="M256 96
      C 332 96 380 158 380 232
      C 380 268 366 296 344 316
      C 356 344 352 372 336 396
      C 322 380 310 372 296 368
      C 300 388 296 408 284 424
      C 272 404 264 396 256 392
      C 248 396 240 404 228 424
      C 216 408 212 388 216 368
      C 202 372 190 380 176 396
      C 160 372 156 344 168 316
      C 146 296 132 268 132 232
      C 132 158 180 96 256 96 Z"
      fill="url(#mist)"/>
  </g>

  <!-- jirones de niebla en la base -->
  <path d="M140 402 C 168 390 190 392 204 404 C 186 414 168 416 140 402 Z" fill="#8b6fd8" opacity="0.55"/>
  <path d="M372 402 C 344 390 322 392 308 404 C 326 414 344 416 372 402 Z" fill="#8b6fd8" opacity="0.55"/>
  <path d="M232 432 C 246 424 266 424 280 432 C 266 442 246 442 232 432 Z" fill="#9d86dd" opacity="0.5"/>

  <!-- orejas de niebla -->
  <path d="M186 128 C 172 96 176 72 194 52 C 210 76 214 100 208 122 Z" fill="url(#mist)" opacity="0.95"/>
  <path d="M326 128 C 340 96 336 72 318 52 C 302 76 298 100 304 122 Z" fill="url(#mist)" opacity="0.95"/>

  <!-- ojos de luna -->
  <g filter="url(#glow)">
    <circle cx="206" cy="222" r="38" fill="url(#eye)"/>
    <circle cx="306" cy="222" r="38" fill="url(#eye)"/>
  </g>
  <!-- brillo interior de los ojos -->
  <circle cx="196" cy="210" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="296" cy="210" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="214" cy="234" r="5" fill="#fff6d8" opacity="0.7"/>
  <circle cx="314" cy="234" r="5" fill="#fff6d8" opacity="0.7"/>
</svg>
